// ─── Helpers ───────────────────────────────────────────────────────────────────
function kindIcon(k) {
  if (k === "dining")    return <UtensilsCrossed size={12} />;
  if (k === "transport") return <Car size={12} />;
  return <Anchor size={12} />;
}
function useOnScreen(ref) {
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) setVisible(true); },
      { threshold: 0, rootMargin: "0px 0px -40px 0px" }
    );
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, [ref]);
  return visible;
}
// ─── Sub-components ────────────────────────────────────────────────────────────
function Pill({ status }) {
  const styles = {
    confirmed:  { bg: C.confirmBg, color: C.confirm, label: "Confirmed" },
    waitlisted: { bg: C.amberBg,   color: C.amber,   label: "Waitlisted" },
    pending:    { bg: "rgba(107,114,128,0.1)", color: C.muted, label: "To Arrange" },
  };
  const s = styles[status];
  return (
    <span style={{
      fontFamily: "'Space Mono', monospace",
      fontSize: "9px", fontWeight: 700,
      letterSpacing: "0.1em", textTransform: "uppercase",
      padding: "3px 8px", borderRadius: "3px",
      background: s.bg, color: s.color, flexShrink: 0,
    }}>
      {s.label}
    </span>
  );
}
function FadeIn({ children, delay = 0 }) {
  const ref = useRef(null);
  const visible = useOnScreen(ref);
  return (
    <div ref={ref} style={{
      opacity: visible ? 1 : 0,
      transform: visible ? "translateY(0)" : "translateY(22px)",
      transition: `opacity 0.7s ease ${delay}s, transform 0.7s ease ${delay}s`,
    }}>
      {children}
    </div>
  );
}

                  {ev.note && (
                    <p style={{
                      fontFamily: "'Inter', sans-serif",
                      fontSize: "12px",
                      color: ev.status === "waitlisted" ? C.amber : C.muted,
                      fontStyle: "italic", lineHeight: 1.55,
                      margin: "0 0 6px",
                    }}>{ev.note}</p>
                  )}
                  {ev.hasMenu && (
                    <button style={{
                      fontFamily: "'Inter', sans-serif",
                      fontSize: "11.5px", fontWeight: 500,
                      color: C.gold, background: "none",
                      border: "none", padding: "0",
                      cursor: "pointer", letterSpacing: "0.02em",
                    }}>
                      View Menu →
                    </button>
                  )}
                </div>
                {/* Badge(s) */}
                <div style={{ paddingTop: "2px", display: "flex", flexDirection: "column", gap: "6px", alignItems: "flex-end" }}>
                  <Pill status={ev.status} />
                  {ev.terrace && (
                    <span style={{
                      fontFamily: "'Space Mono', monospace",
                      fontSize: "9px", fontWeight: 700,
                      letterSpacing: "0.1em", textTransform: "uppercase",
                      padding: "3px 8px", borderRadius: "3px",
                      background: C.amberBg, color: C.amber,
                      whiteSpace: "nowrap",
                    }}>Terrace · WL</span>
                  )}
                </div>
              </div>
            ))}
          </div>
        </div>
        {/* Photo — right side */}
        {flip && (
          <div className="day-photo" style={{
            position: "sticky", top: "32px",
            borderRadius: "2px", overflow: "hidden",
            aspectRatio: "3 / 4",
          }}>
            <img src={day.photo} alt={day.photoAlt}
              style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
          </div>
        )}
      </div>
    </section>
  );
}
// ─── Closing section ───────────────────────────────────────────────────────────
function Closing() {
  return (
    <section className="closing-pad" style={{
      background: C.navy,
      padding: "80px 48px",
      position: "relative", overflow: "hidden",
    }}>
      <div style={{
        position: "absolute", inset: 0,
        backgroundImage: `url(${IMGS.coastline})`,
        backgroundSize: "cover", backgroundPosition: "center 60%",
        opacity: 0.12,
      }} />
      <div style={{
        maxWidth: "900px", margin: "0 auto",
        position: "relative",
        display: "flex", alignItems: "center", justifyContent: "space-between",
        flexWrap: "wrap", gap: "24px",
      }}>
        <div>
          <div style={{
            fontFamily: "'Cormorant', serif",
            fontSize: "clamp(1.4rem, 3vw, 2rem)",
            fontWeight: 400, fontStyle: "italic",
            color: C.white, marginBottom: "6px",
          }}>Hotel Pitrizza, Luxury Collection</div>
          <div style={{
            fontFamily: "'Inter', sans-serif",
            fontSize: "12px", color: "rgba(255,255,255,0.35)",
            letterSpacing: "0.03em",
          }}>Porto Cervo · Costa Smeralda · Sardinia</div>
        </div>
        <div style={{
          fontFamily: "'Space Mono', monospace",
          fontSize: "9px", letterSpacing: "0.2em",
          textTransform: "uppercase",
          color: "rgba(255,255,255,0.2)",
        }}>20 – 23 August 2026</div>
      </div>
    </section>
  );
}
// ─── Floating actions ──────────────────────────────────────────────────────────
function FloatingActions() {
  return (
    <div style={{
      position: "fixed", bottom: "28px", right: "28px",
      zIndex: 100,
    }} className="no-print fab">
      <button onClick={() => window.print()} style={{
        display: "flex", alignItems: "center", gap: "7px",
        padding: "10px 16px",
        borderRadius: "3px",
        fontFamily: "'Space Mono', monospace",
        fontSize: "10px", fontWeight: 700,
        letterSpacing: "0.12em", textTransform: "uppercase",
        cursor: "pointer",
        background: C.navy,
        color: C.sand,
        border: `1px solid rgba(196,168,130,0.25)`,
        boxShadow: "0 4px 24px rgba(0,0,0,0.4)",
        transition: "opacity 0.2s ease",
      }}>
        <Download size={11} />
        Save PDF
      </button>
    </div>
  );
}
// ─── App ───────────────────────────────────────────────────────────────────────
function App() {
  return (
    <>
      <style>{`
        html { scroll-behavior: smooth; }
        body { background: #09131E; }
        @keyframes pulseBar {
          0%, 100% { opacity: 0.3; transform: scaleY(1); }
          50% { opacity: 0.8; transform: scaleY(1.2); }
        }
        @media (max-width: 680px) {
          .accom-grid  { grid-template-columns: 1fr !important; gap: 32px !important; }
          .day-grid    { grid-template-columns: 1fr !important; gap: 0 !important; }
          .day-photo   { display: none !important; }
          .day-content { padding-top: 0 !important; }
          .hero-text   { padding: 0 24px 48px !important; }
          .top-bar     { padding: 20px 24px !important; }
          .section-pad { padding: 56px 24px !important; }
          .day-pad     { padding: 0 24px 56px !important; }
          .prog-intro  { padding: 48px 24px 36px !important; }
          .closing-pad { padding: 56px 24px !important; }
          .fab         { bottom: 20px !important; right: 20px !important; }
        }
        ::-webkit-scrollbar { width: 0; }
        /* ── Print styles ── */
        @media print {
          @page { size: A4 portrait; margin: 14mm 16mm; }
          .no-print { display: none !important; }
          /* Reset animations so everything is visible */
          * { opacity: 1 !important; transform: none !important; transition: none !important; }
          /* Hero: compact print header */
          .print-hero-full { display: none !important; }
          .print-header { display: block !important; }
          body { background: #fff !important; }
          /* Navy sections: lighten for print */
          section[data-dark="true"] {
            background: #f4f4f4 !important;
          }
          section[data-dark="true"] * {
            color: #111 !important;
            border-color: #ccc !important;
          }
          /* Day grids: single column */
          .day-grid {
            grid-template-columns: 1fr !important;
          }
          .day-grid .day-photo {
            display: none !important;
          }
          .accom-grid { grid-template-columns: 1fr !important; }
          /* Avoid breaks mid-event */
          .event-row { break-inside: avoid; }
          /* Page breaks between days */
          .day-section { break-inside: avoid; }
        }
      `}</style>
      {/* Compact print-only header */}
      <div className="print-header" style={{ display: "none", padding: "0 0 20px", borderBottom: "1px solid #ddd", marginBottom: "24px" }}>
        <div style={{ fontFamily: "'Space Mono', monospace", fontSize: "9px", letterSpacing: "0.2em", textTransform: "uppercase", color: "#888", marginBottom: "6px" }}>Travel Programme · Porto Cervo</div>
        <div style={{ fontFamily: "'Cormorant', serif", fontSize: "28px", fontWeight: 400, fontStyle: "italic", color: "#111" }}>20 – 23 August 2026</div>
        <div style={{ fontFamily: "'Inter', sans-serif", fontSize: "12px", color: "#555", marginTop: "4px" }}>Hotel Pitrizza, Luxury Collection · Costa Smeralda</div>
      </div>
      <div className="print-hero-full">
        <Hero />
      </div>
      <AccommodationSection />
      <ProgrammeIntro />
      {DAYS.map((day, i) => (
        <DayBlock key={day.n} day={day} flip={i % 2 === 1} />
      ))}
      <Closing />
      <FloatingActions />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

}

@media print {
  @page { size: A4 landscape; margin: 0; }

    position: fixed !important; inset: 0 !important;

}

// ── Shared atoms ───────────────────────────────────────────────────────────────
function Label({ children }) {

    <div style={{
      display: "flex", alignItems: "center", gap: "0.55rem",

}
function Confirmed({ pending = false }) {

}
function TlDay({ n, head, lines }) {
  return (
    <div style={{ display: "grid", gridTemplateColumns: "26px 1fr", gap: "0.75rem" }}>
      <div style={{
        width: "26px", height: "26px", borderRadius: "5px", flexShrink: 0,

          fontFamily: F.body, fontWeight: 600, fontSize: "0.78rem",
          color: C.cream, marginBottom: "0.3rem",

          <div key={i} style={{

            color: C.creamSub, lineHeight: 1.6, marginBottom: "0.18rem",

      </div>

  );
}
function FeatureRow({ icon, title, sub }) {
  return (
    <div style={{
      display: "grid", gridTemplateColumns: "28px 1fr", gap: "0.7rem",

      <span style={{ fontSize: "0.85rem", paddingTop: "1px" }}>{icon}</span>

        <div style={{ fontFamily: F.body, fontWeight: 400, fontSize: "0.72rem", color: C.creamSub }}>{sub}</div>
      </div>
    </div>
  );
}
function PhotoPane({ src, alt, fade = "right" }) {
  const gradient =
    fade === "right" ? `linear-gradient(to right, ${C.bg} 0%, rgba(12,11,9,0.5) 25%, transparent 55%)` :
    fade === "left"  ? `linear-gradient(to left,  ${C.bg} 0%, rgba(12,11,9,0.5) 25%, transparent 55%)` :
    `linear-gradient(to top, ${C.bg} 0%, rgba(12,11,9,0.6) 30%, transparent 70%)`;
  return (
    <div style={{ position: "relative", overflow: "hidden", background: "#060505" }}>
      <img src={src} alt={alt} style={{ width: "100%", height: "100%", objectFit: "cover", display: "block", opacity: 0.75 }} />
      <div style={{ position: "absolute", inset: 0, background: gradient }} />
    </div>
  );
}
function GoldRule({ my = "1rem" }) {
  return <div style={{ height: "1px", background: C.lineGold, margin: `${my} 0` }} />;
}
function SectionTag({ children }) {
  return (
    <div style={{
      display: "inline-flex", alignItems: "center", gap: "0.4rem",
      fontFamily: F.mono, fontSize: "0.58rem", letterSpacing: "0.2em",

      padding: "0.3rem 0.6rem", marginBottom: "0.9rem",

  );
}

// ── Slides registry ────────────────────────────────────────────────────────────
const SLIDES = [Slide1, Slide2, Slide3, Slide4, Slide5, Slide6, Slide7, Slide8];
// ── App shell ──────────────────────────────────────────────────────────────────
function App() {
  const [current, setCurrent] = useState(0);
  const [prev, setPrev]       = useState(null);
  const [dir, setDir]         = useState(1);
  const [busy, setBusy]       = useState(false);
  const timerRef              = useRef();
  useEffect(() => {
    const tag = document.createElement("style");
    tag.textContent = PRINT_STYLES;
    document.head.appendChild(tag);
    return () => { document.head.removeChild(tag); };
  }, []);
  const goTo = useCallback((index, direction) => {
    if (busy || index < 0 || index >= TOTAL) return;
    setBusy(true);
    setDir(direction);
    setPrev(current);
    setCurrent(index);
    clearTimeout(timerRef.current);
    timerRef.current = setTimeout(() => { setPrev(null); setBusy(false); }, 560);
  }, [busy, current]);
  const next = useCallback(() => goTo(current + 1,  1), [current, goTo]);
  const back = useCallback(() => goTo(current - 1, -1), [current, goTo]);
  useEffect(() => {
    const fn = (e) => {
      if (e.key === "ArrowRight" || e.key === "PageDown") next();
      if (e.key === "ArrowLeft"  || e.key === "PageUp")   back();
    };
    window.addEventListener("keydown", fn);
    return () => window.removeEventListener("keydown", fn);
  }, [next, back]);
  useEffect(() => () => clearTimeout(timerRef.current), []);
  const enterX = dir === 1 ? "translateX(2.5%)" : "translateX(-2.5%)";
  const exitX  = dir === 1 ? "translateX(-2%)"  : "translateX(2%)";
  const renderSlide = (index) => {
    const S = SLIDES[index];
    return <S />;
  };
  return (
    <div className="fixed inset-0 overflow-hidden" style={{ background: C.bg, fontFamily: F.body }}>
      {/* Slide stage */}
      <div className="absolute inset-0">
        {prev !== null && (
          <div key={`p-${prev}`} className="absolute inset-0" style={{
            transform: exitX, opacity: 0,
            transition: "transform 520ms cubic-bezier(0.76,0,0.24,1), opacity 380ms ease",
          }}>
            {renderSlide(prev)}
          </div>
        )}
        <div key={`c-${current}`} className="absolute inset-0" style={{
          transform: busy ? enterX : "translateX(0)",
          opacity: busy ? 0 : 1,
          transition: busy
            ? "none"
            : "transform 540ms cubic-bezier(0.76,0,0.24,1), opacity 420ms ease",
        }}>
          {renderSlide(current)}
        </div>
      </div>
      {/* Prev arrow */}
      <button
        onClick={back} disabled={current === 0}
        className="no-print absolute left-0 top-0 bottom-0 z-20 flex items-center pl-4 group disabled:pointer-events-none"
        style={{ width: "64px" }} aria-label="Previous"
      >
        <div className="transition-all duration-200 opacity-0 group-hover:opacity-100" style={{
          width: "34px", height: "34px", borderRadius: "50%",
          background: "rgba(237,229,204,0.07)", border: `1px solid ${C.lineGold}`,
          backdropFilter: "blur(8px)",
          display: "flex", alignItems: "center", justifyContent: "center",
        }}>
          <ChevronLeft size={14} style={{ color: C.creamSub }} />
        </div>
      </button>
      {/* Next arrow */}
      <button
        onClick={next} disabled={current === TOTAL - 1}
        className="no-print absolute right-0 top-0 bottom-0 z-20 flex items-center justify-end pr-4 group disabled:pointer-events-none"
        style={{ width: "64px" }} aria-label="Next"
      >
        <div className="transition-all duration-200 opacity-0 group-hover:opacity-100" style={{
          width: "34px", height: "34px", borderRadius: "50%",
          background: "rgba(237,229,204,0.07)", border: `1px solid ${C.lineGold}`,
          backdropFilter: "blur(8px)",
          display: "flex", alignItems: "center", justifyContent: "center",
        }}>
          <ChevronRight size={14} style={{ color: C.creamSub }} />
        </div>
      </button>
      {/* Dot indicators */}
      <div className="no-print absolute bottom-5 left-0 right-0 z-30 flex justify-center items-center gap-2">
        {Array.from({ length: TOTAL }).map((_, i) => (
          <button
            key={i} onClick={() => goTo(i, i > current ? 1 : -1)}
            style={{
              width: i === current ? "22px" : "5px", height: "4px",
              borderRadius: "3px", border: "none", padding: 0, cursor: "pointer",
              background: i === current ? C.gold : C.lineGold,
              transition: "width 280ms ease, background 280ms ease",
            }}
            aria-label={`Slide ${i + 1}`}
          />
        ))}
      </div>
      {/* Slide counter */}
      <div className="no-print absolute bottom-4 right-8 z-30" style={{
        fontFamily: F.mono, fontSize: "0.62rem", letterSpacing: "0.12em", color: C.muted,
      }}>
        <span style={{ color: C.gold }}>{String(current + 1).padStart(2, "0")}</span>
        {" / "}
        {String(TOTAL).padStart(2, "0")}
      </div>
      {/* Export PDF */}
      <button
        onClick={() => window.print()}
        className="no-print absolute top-5 right-7 z-30 flex items-center gap-1.5 transition-opacity duration-200 hover:opacity-60"
        style={{
          fontFamily: F.mono, fontSize: "0.58rem", letterSpacing: "0.18em",
          textTransform: "uppercase", color: C.muted,
          background: "transparent", border: `1px solid ${C.line}`,
          borderRadius: "3px", padding: "5px 9px", cursor: "pointer",
        }}
      >
        <Download size={9} style={{ color: C.gold }} />
        Export PDF
      </button>
      {/* Hidden print deck */}
      <div className="print-deck">
        {SLIDES.map((S, i) => (
          <div key={i} className="print-slide"><S /></div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
